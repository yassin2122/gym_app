name: gym_app
description: A premium gym workout tracking application.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Backend / auth / storage
  supabase_flutter: ^2.5.9

  # Charts (Dashboard/Statistics — wired now, used starting Phase 2)
  fl_chart: ^0.68.0

  # Animations
  flutter_animate: ^4.5.0

  # Icons
  lucide_icons: ^0.257.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
